backend:
  name: git-gateway
  branch: main

# Wird durch Netlify Identity verwaltet (Login-Screen erscheint automatisch)
local_backend: false

publish_mode: simple

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  # ============ AKTUELLES / NEWS ============
  - name: "aktuelles"
    label: "Aktuelles / News"
    files:
      - file: "_data/aktuelles.json"
        label: "News-Beiträge"
        name: "aktuelles"
        fields:
          - label: "News-Beiträge"
            name: "news"
            widget: "list"
            label_singular: "News-Beitrag"
            summary: "{{titel}} ({{datum}})"
            fields:
              - { label: "Datum", name: "datum", widget: "string", hint: "z.B. 18. April 2026" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Aktuell / Hervorgehoben", name: "hervorgehoben", widget: "boolean", default: false, hint: "Der oberste hervorgehobene Eintrag wird auf der Startseite als Highlight angezeigt" }
              - { label: "Titelbild (optional)", name: "bild", widget: "image", required: false, hint: "Großes Bild oben im Beitrag" }
              - { label: "Titelbild – Format", name: "bild_format", widget: "select", required: false, default: "original", options: [{ label: "Original (ganzes Bild, nichts abgeschnitten)", value: "original" }, { label: "Querformat 16:9", value: "16:9" }, { label: "Banner 21:9", value: "21:9" }, { label: "Klassisch 4:3", value: "4:3" }, { label: "Quadratisch 1:1", value: "1:1" }], hint: "Bei allen Formaten außer Original wird das Bild auf die Größe zugeschnitten. Per Klick wird es immer vollständig angezeigt." }
              - { label: "Titelbild – Ausschnitt", name: "bild_ausschnitt", widget: "select", required: false, default: "mitte", options: [{ label: "Oben", value: "oben" }, { label: "Mitte", value: "mitte" }, { label: "Unten", value: "unten" }], hint: "Welcher Teil sichtbar bleibt, wenn zugeschnitten wird (z. B. Oben bei Gruppenfotos mit Köpfen am oberen Rand). Bei Original ohne Wirkung." }
              - { label: "Bilderserie (optional)", name: "galerie", widget: "list", required: false, field: { label: "Bild", name: "bild", widget: "image" }, hint: "Mehrere Fotos, werden als Galerie unter dem Text angezeigt" }

  # ============ PREISE ============
  - name: "preise"
    label: "Preise & Mitgliedschaft"
    files:
      - file: "_data/preise.json"
        label: "Preise"
        name: "preise"
        fields:
          - label: "Tarife"
            name: "tarife"
            widget: "list"
            label_singular: "Tarif"
            summary: "{{name}} ({{altersgruppe}}) – {{laufzeit}} – {{preis}},{{cent}} €"
            hint: "Jeder Tarif hat einen eigenen Namen, eine Laufzeit, einen Preis und eine Altersgruppe. Reihenfolge per Drag&Drop änderbar."
            fields:
              - { label: "Name", name: "name", widget: "string", hint: "z.B. Panthers, BJJ, Mini Panthers" }
              - { label: "Laufzeit", name: "laufzeit", widget: "string", hint: "z.B. 12 Monate oder Flex · monatlich" }
              - label: "Altersgruppe"
                name: "altersgruppe"
                widget: "select"
                options: ["Erwachsene", "Kinder"]
                default: "Erwachsene"
              - { label: "Preis (Euro, ganze Zahl)", name: "preis", widget: "string", hint: "z.B. 54" }
              - { label: "Preis (Cent, zweistellig)", name: "cent", widget: "string", hint: "z.B. 90" }
              - label: "Preiseinheit"
                name: "einheit"
                widget: "select"
                options: ["Monat", "Stunde", "Einheit", "Termin", "Session", "Karte"]
                default: "Monat"
                required: false
                hint: "Wird hinter dem Preis angezeigt, z.B. '54,90 / Stunde'"
              - { label: "Beschreibungstext", name: "hinweis", widget: "text" }
              - { label: "Sparhinweis (optional)", name: "sparhinweis", widget: "string", required: false, hint: "z.B. ↓ Günstigster Tarif – leer lassen wenn keiner" }
              - { label: "Als 'Beliebt' markieren", name: "beliebt", widget: "boolean", default: false }

          - label: "Anmeldegebühr"
            name: "anmeldegebuehr"
            widget: "object"
            fields:
              - { label: "Betrag (für Überschrift)", name: "betrag", widget: "string", hint: "z.B. 49,90 €" }
              - { label: "Überschrift", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

  # ============ SEMINARE ============
  - name: "seminare"
    label: "Seminare"
    files:
      - file: "_data/seminare.json"
        label: "Seminartermine & Buchung"
        name: "seminare"
        fields:
          - { label: "Einleitungstext (über der Seminarliste)", name: "einleitungstext", widget: "text", required: false, hint: "Allgemeiner Text, der oberhalb der Seminartermine angezeigt wird. Leer lassen, wenn nicht benötigt." }

          # ---------- STANDARD-PREISE ----------
          - label: "Standard-Preise (gelten für alle Termine ohne eigene Preise)"
            name: "standardpreise"
            widget: "list"
            required: false
            label_singular: "Preis"
            summary: "{{bezeichnung}} – {{betrag}} €"
            hint: "Hier legst du die Preise einmal fest, z.B. Normalpreis, Studierende, Auszubildende. Jede Zeile wird auf der Webseite als auswählbares Ticket angezeigt. Nur ein Eintrag = nur ein Preis."
            fields:
              - { label: "Bezeichnung", name: "bezeichnung", widget: "string", hint: "z.B. Normalpreis, Studierende, Auszubildende, Schüler" }
              - { label: "Preis in € (inkl. MwSt.)", name: "betrag", widget: "number", value_type: "float", min: 0, step: 0.5, hint: "Bruttopreis inkl. gesetzlicher MwSt., z.B. 79 oder 59.5" }
              - { label: "Nachweis erforderlich? (optional)", name: "nachweis_hinweis", widget: "string", required: false, hint: "Nur bei ermäßigten Preisen, z.B. Studierendenausweis oder Ausbildungsnachweis. Der Kunde muss dann bestätigen, den Nachweis am Seminartag mitzubringen. Bei Normalpreis leer lassen." }

          # ---------- EINSTELLUNGEN BUCHUNG ----------
          - label: "Buchung & Zahlung (Einstellungen)"
            name: "buchung"
            widget: "object"
            collapsed: true
            summary: "Bankdaten, Stornofristen, Webhook"
            hint: "Diese Angaben gelten für alle Seminarbuchungen. Normalerweise einmal einrichten und dann nicht mehr ändern."
            fields:
              - { label: "Webhook-URL (Make)", name: "webhook_url", widget: "string", required: false, hint: "Die Adresse aus dem Make-Szenario (Custom Webhook). Ohne diese Adresse ist keine Buchung möglich." }
              - { label: "Kontoinhaber (für Überweisungen)", name: "kontoinhaber", widget: "string", default: "Fight & Defense GbR" }
              - { label: "IBAN (für Überweisungen)", name: "iban", widget: "string", required: false }
              - { label: "BIC", name: "bic", widget: "string", required: false }
              - { label: "Bank", name: "bank", widget: "string", required: false }
              - { label: "Gläubiger-Identifikationsnummer (für Lastschrift)", name: "glaeubiger_id", widget: "string", required: false, hint: "Beginnt mit DE und hat 18 Stellen. Ohne diese Nummer wird die Lastschrift nicht angeboten." }
              - { label: "Name des Veranstalters", name: "veranstalter", widget: "string", default: "Fight & Defense GbR" }
              - { label: "Anschrift des Veranstalters", name: "anschrift", widget: "string", default: "Auf dem Schmaarkamp 1b, 21339 Lüneburg" }
              - { label: "Veranstaltungsort", name: "ort", widget: "string", default: "Auf dem Schmaarkamp 1b, 21339 Lüneburg" }
              - { label: "E-Mail für Rückfragen und Stornos", name: "kontakt_email", widget: "string", default: "info@fightanddefense.de" }
              - { label: "MwSt.-Satz in %", name: "ust_satz", widget: "number", value_type: "float", min: 0, max: 30, default: 19 }
              - { label: "Zahlungsfrist Überweisung (Tage nach Buchung)", name: "ueberweisung_frist_tage", widget: "number", value_type: "int", min: 1, default: 7, hint: "Wird automatisch auf den Tag vor dem Seminar begrenzt." }
              - { label: "Anmeldeschluss (Tage vor Seminarbeginn)", name: "anmeldeschluss_tage", widget: "number", value_type: "int", min: 0, default: 2, hint: "Danach ist keine Online-Buchung mehr möglich, der Termin zeigt dann 'Anfrage per E-Mail'." }
              - { label: "Weitere Personen pro Buchung (Maximum)", name: "max_weitere_personen", widget: "number", value_type: "int", min: 0, max: 20, default: 5, hint: "Wie viele weitere Personen ein Kunde in einer Buchung mit anmelden darf. 0 schaltet die Funktion aus. Für jede Person fällt ein eigenes Ticket an." }
              - { label: "Lastschrift: Einzug (Tage vor Seminarbeginn)", name: "einzug_tage_vor", widget: "number", value_type: "int", min: 1, default: 7 }
              - { label: "Lastschrift: Frist der Vorabinformation (Tage)", name: "vorabinformation_tage", widget: "number", value_type: "int", min: 1, default: 2, hint: "Gesetzlich 14 Tage, kann aber vertraglich verkürzt werden (steht so im Mandatstext)." }
              - { label: "Storno Stufe 2: gilt ab (Tage vor Seminarbeginn)", name: "storno_stufe2_ab_tage", widget: "number", value_type: "int", min: 1, default: 14, hint: "Davor ist die Stornierung kostenfrei. Beispiel 14: ab 14 Tage vor Beginn gilt die Gebühr der Stufe 2." }
              - { label: "Storno Stufe 2: Stornogebühr in % des gezahlten Preises", name: "storno_stufe2_prozent", widget: "number", value_type: "int", min: 0, max: 100, default: 50 }
              - { label: "Storno Stufe 3: gilt ab (Tage vor Seminarbeginn)", name: "storno_stufe3_ab_tage", widget: "number", value_type: "int", min: 0, default: 7, hint: "Muss kleiner sein als bei Stufe 2. Beispiel 7: ab 7 Tage vor Beginn und bei Nichterscheinen." }
              - { label: "Storno Stufe 3: Stornogebühr in % des gezahlten Preises", name: "storno_stufe3_prozent", widget: "number", value_type: "int", min: 0, max: 100, default: 100 }
              - { label: "Zusatztext zu den Stornobedingungen (optional)", name: "storno_zusatz", widget: "text", required: false, hint: "Leer lassen für den Standardtext (Ersatzteilnehmer, Nachweis geringeren Schadens, Absage durch uns)." }
              - { label: "Text der Teilnahme-Bestätigung (optional)", name: "teilnahme_text", widget: "text", required: false, hint: "Checkbox im Formular. Leer lassen für den Standardtext (gesundheitlich in der Lage, Teilnahme auf eigene Verantwortung). Hier kannst du auch eine Altersvorgabe ergänzen." }

          # ---------- TERMINE ----------
          - label: "Seminare"
            name: "seminare"
            widget: "list"
            label_singular: "Seminar"
            summary: "{{titel}} – {{datum}}"
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - label: "Kategorie"
                name: "kategorie"
                widget: "select"
                required: false
                options: ["Selbstverteidigung", "Kampfsport", "Fitness", "Für Frauen", "Für Kinder & Jugendliche", "Firmen & Gruppen", "Sonstiges"]
              - { label: "Datum & Uhrzeit (Anzeigetext)", name: "datum", widget: "string", hint: "So steht es auf der Webseite, z.B. 25. Oktober 2026, 11:00 – 15:00 Uhr" }
              - { label: "Beginn (für Buchung & Stornofristen)", name: "beginn", widget: "datetime", format: "YYYY-MM-DDTHH:mm", date_format: "DD.MM.YYYY", time_format: "HH:mm", picker_utc: false, required: false, hint: "WICHTIG: Ohne Beginn ist der Termin nicht online buchbar. Daraus werden die Stornofristen berechnet. Vergangene Termine blendet die Webseite automatisch aus." }
              - { label: "Ausgebucht", name: "ausgebucht", widget: "boolean", default: false, required: false, hint: "Wenn aktiv, ist der Termin nicht mehr buchbar und zeigt 'ausgebucht'." }
              - { label: "Beschreibung", name: "text", widget: "text" }
              - { label: "Titelbild (optional)", name: "bild", widget: "image", required: false }
              - { label: "Bilderserie (optional)", name: "galerie", widget: "list", required: false, field: { label: "Bild", name: "bild", widget: "image" }, hint: "Mehrere Fotos, werden als Galerie unter dem Text angezeigt" }
              - label: "Eigene Preise für diesen Termin (optional)"
                name: "preise"
                widget: "list"
                required: false
                collapsed: true
                label_singular: "Preis"
                summary: "{{bezeichnung}} – {{betrag}} €"
                hint: "Nur ausfüllen, wenn dieser Termin andere Preise hat als die Standard-Preise. Sonst leer lassen."
                fields:
                  - { label: "Bezeichnung", name: "bezeichnung", widget: "string" }
                  - { label: "Preis in € (inkl. MwSt.)", name: "betrag", widget: "number", value_type: "float", min: 0, step: 0.5 }
                  - { label: "Nachweis erforderlich? (optional)", name: "nachweis_hinweis", widget: "string", required: false }
              - { label: "Alter Anmelde-Link (optional, nur noch als Ersatz)", name: "link", widget: "string", required: false, hint: "Wird nur verwendet, wenn der Termin nicht online buchbar ist (z.B. kein Beginn oder keine Preise gepflegt)." }

  # ============ STUNDENPLAN ============
  - name: "stundenplan"
    label: "Stundenplan"
    files:
      - file: "_data/stundenplan.json"
        label: "Trainingszeiten"
        name: "stundenplan"
        fields:
          - label: "Wochentage"
            name: "tage"
            widget: "list"
            label_singular: "Tag"
            summary: "{{tag}}"
            fields:
              - { label: "Wochentag", name: "tag", widget: "string" }
              - label: "Kurse"
                name: "kurse"
                widget: "list"
                label_singular: "Kurs"
                summary: "{{zeit}} – {{name}}"
                fields:
                  - { label: "Uhrzeit", name: "zeit", widget: "string", hint: "z.B. 18:00 – 19:15" }
                  - { label: "Kursname", name: "name", widget: "string" }

  # ============ STUNDENPLAN UELZEN ============
  - name: "stundenplan_uelzen"
    label: "Stundenplan Uelzen"
    files:
      - file: "_data/stundenplan_uelzen.json"
        label: "Trainingszeiten Uelzen"
        name: "stundenplan_uelzen"
        fields:
          - label: "Wochentage"
            name: "tage"
            widget: "list"
            label_singular: "Tag"
            summary: "{{tag}}"
            fields:
              - { label: "Wochentag", name: "tag", widget: "string" }
              - label: "Kurse"
                name: "kurse"
                widget: "list"
                label_singular: "Kurs"
                summary: "{{zeit}} – {{name}}"
                fields:
                  - { label: "Uhrzeit", name: "zeit", widget: "string", hint: "z.B. 18:00 – 19:15" }
                  - { label: "Kursname", name: "name", widget: "string" }

  # ============ TRAINING IN UELZEN ============
  - name: "training_uelzen"
    label: "Training in Uelzen"
    files:
      - file: "_data/training_uelzen.json"
        label: "Texte, Bilder & Formular"
        name: "training_uelzen"
        fields:
          - { label: "Beschreibungstext 1", name: "text1", widget: "text" }
          - { label: "Beschreibungstext 2", name: "text2", widget: "text", required: false }
          - { label: "Bilderserie (optional)", name: "galerie", widget: "list", required: false, field: { label: "Bild", name: "bild", widget: "image" }, hint: "Fotos vom Training in Uelzen, werden als Galerie angezeigt" }
          - { label: "Mitgliedsantrag Uelzen (PDF)", name: "mitgliedsantrag_pdf", widget: "file", required: false, hint: "Eigenes PDF für den Standort Uelzen hochladen. Leer lassen, um den Download-Button auf der Seite auszublenden." }

          - label: "Adresse Uelzen"
            name: "adresse"
            widget: "object"
            hint: "Eigene Standort-Adresse für die Uelzen-Seite (Telefon & E-Mail bleiben zentral wie bei Lüneburg)."
            fields:
              - { label: "Einrichtung / Name", name: "name", widget: "string", hint: "z.B. Easyfitness Uelzen (ehemals Gym80)" }
              - { label: "Straße & Hausnummer", name: "strasse", widget: "string" }
              - { label: "PLZ & Ort", name: "ort", widget: "string" }

          - label: "Preise Uelzen"
            name: "preise"
            widget: "object"
            hint: "Eigene Preisliste für den Standort Uelzen."
            fields:
              - label: "Tarife"
                name: "tarife"
                widget: "list"
                label_singular: "Tarif"
                required: false
                summary: "{{name}} ({{altersgruppe}}) – {{laufzeit}} – {{preis}},{{cent}} €"
                hint: "Jeder Tarif hat einen eigenen Namen, eine Laufzeit, einen Preis und eine Altersgruppe. Reihenfolge per Drag&Drop änderbar."
                fields:
                  - { label: "Name", name: "name", widget: "string", hint: "z.B. Panthers, BJJ, Mini Panthers" }
                  - { label: "Laufzeit", name: "laufzeit", widget: "string", hint: "z.B. 12 Monate oder Flex · monatlich" }
                  - label: "Altersgruppe"
                    name: "altersgruppe"
                    widget: "select"
                    options: ["Erwachsene", "Kinder"]
                    default: "Erwachsene"
                  - { label: "Preis (Euro, ganze Zahl)", name: "preis", widget: "string", hint: "z.B. 54" }
                  - { label: "Preis (Cent, zweistellig)", name: "cent", widget: "string", hint: "z.B. 90" }
                  - label: "Preiseinheit"
                    name: "einheit"
                    widget: "select"
                    options: ["Monat", "Stunde", "Einheit", "Termin", "Session", "Karte"]
                    default: "Monat"
                    required: false
                    hint: "Wird hinter dem Preis angezeigt, z.B. '54,90 / Stunde'"
                  - { label: "Beschreibungstext", name: "hinweis", widget: "text" }
                  - { label: "Sparhinweis (optional)", name: "sparhinweis", widget: "string", required: false, hint: "z.B. ↓ Günstigster Tarif – leer lassen wenn keiner" }
                  - { label: "Als 'Beliebt' markieren", name: "beliebt", widget: "boolean", default: false }

              - label: "Anmeldegebühr"
                name: "anmeldegebuehr"
                widget: "object"
                required: false
                fields:
                  - { label: "Betrag (für Überschrift)", name: "betrag", widget: "string", hint: "z.B. 49,90 €", required: false }
                  - { label: "Überschrift", name: "titel", widget: "string", required: false }
                  - { label: "Text", name: "text", widget: "text", required: false }

          - label: "Anfrageformular (MATOOL)"
            name: "formular"
            widget: "object"
            hint: "Hier kannst du das interne Anfrageformular auf der Uelzen-Seite durch ein externes MATOOL-Formular ersetzen (eigener Standort, eigener Code)."
            fields:
              - { label: "iframe-Einbettungscode von MATOOL", name: "iframe_code", widget: "text", required: false, hint: "Den kompletten <iframe ...>...</iframe>-Code aus MATOOL hier einfügen. Leer lassen, um das interne Formular weiter zu verwenden." }
              - { label: "Höhe des Formulars (in Pixel)", name: "hoehe", widget: "number", default: 600, hint: "Falls das Formular abgeschnitten wirkt oder zu viel Leerraum lässt, hier die Höhe anpassen, z.B. 600, 750, 900." }

  # ============ TEAM ============
  - name: "team"
    label: "Team"
    files:
      - file: "_data/team.json"
        label: "Team-Mitglieder"
        name: "team"
        fields:
          - label: "Team"
            name: "team"
            widget: "list"
            label_singular: "Trainer/in"
            summary: "{{name}} – {{rolle}}"
            fields:
              - { label: "Kürzel/Initiale (für Avatar, falls kein Foto)", name: "kuerzel", widget: "string", hint: "Ein Buchstabe, z.B. S" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Rolle", name: "rolle", widget: "string" }
              - { label: "Bio / Beschreibung", name: "bio", widget: "text" }
              - { label: "Foto (optional)", name: "foto", widget: "image", required: false, hint: "Wenn ein Foto hochgeladen wird, ersetzt es den Buchstaben-Avatar" }

  # ============ ALLGEMEINE INHALTE ============
  - name: "inhalte"
    label: "Allgemeine Inhalte"
    files:
      - file: "_data/inhalte.json"
        label: "Kontakt, Startseite & Trainerausbildung"
        name: "inhalte"
        fields:
          - label: "Kontaktdaten"
            name: "kontakt"
            widget: "object"
            fields:
              - { label: "Adresse Zeile 1 (Straße)", name: "adresse_zeile1", widget: "string" }
              - { label: "Adresse Zeile 2 (PLZ Ort)", name: "adresse_zeile2", widget: "string" }
              - { label: "Telefonnummer (Anzeige)", name: "telefon", widget: "string", hint: "z.B. 0178 - 83 46 838" }
              - { label: "Telefonnummer (für Link, mit Ländervorwahl)", name: "telefon_link", widget: "string", hint: "z.B. +491788346838" }
              - { label: "E-Mail-Adresse", name: "email", widget: "string" }

          - label: "Startseite – Hero-Bereich"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Untertext", name: "untertext", widget: "text" }

          - label: "Startseite – Aktuelles Highlight"
            name: "highlight_seminar"
            widget: "object"
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Datum & Uhrzeit", name: "datum", widget: "string" }
              - { label: "Beschreibung", name: "text", widget: "text" }

          - label: "Trainerausbildung – Texte"
            name: "trainerausbildung"
            widget: "object"
            fields:
              - { label: "Beschreibungstext 1", name: "text1", widget: "text" }
              - { label: "Beschreibungstext 2", name: "text2", widget: "text" }
              - { label: "YouTube-Link (optional)", name: "youtube_link", widget: "string", required: false, hint: "Vollständiger YouTube-Link, z.B. https://www.youtube.com/watch?v=..." }

          - label: "Trainerausbildung-Formular (MATOOL)"
            name: "trainerausbildung_formular"
            widget: "object"
            hint: "Hier kannst du das interne Anfrageformular auf der Trainerausbildungs-Seite durch ein externes MATOOL-Formular ersetzen."
            fields:
              - { label: "iframe-Einbettungscode von MATOOL", name: "iframe_code", widget: "text", required: false, hint: "Den kompletten <iframe ...>...</iframe>-Code aus MATOOL hier einfügen. Leer lassen, um das bisherige interne Formular weiter zu verwenden." }
              - { label: "Höhe des Formulars (in Pixel)", name: "hoehe", widget: "number", default: 600, hint: "Falls das Formular abgeschnitten wirkt oder zu viel Leerraum lässt, hier die Höhe anpassen, z.B. 600, 750, 900." }

          - label: "Probetraining-Formular (MATOOL)"
            name: "probetraining_formular"
            widget: "object"
            hint: "Hier kannst du das interne Anfrageformular durch ein externes MATOOL-Formular ersetzen."
            fields:
              - { label: "iframe-Einbettungscode von MATOOL", name: "iframe_code", widget: "text", required: false, hint: "Den kompletten <iframe ...>...</iframe>-Code aus MATOOL hier einfügen. Leer lassen, um das bisherige interne Formular weiter zu verwenden." }
              - { label: "Höhe des Formulars (in Pixel)", name: "hoehe", widget: "number", default: 600, hint: "Falls das Formular abgeschnitten wirkt oder zu viel Leerraum lässt, hier die Höhe anpassen, z.B. 600, 750, 900." }

          - label: "Startseite – CTA-Streifen"
            name: "cta_strip"
            widget: "object"
            hint: "Der farbige Streifen mit Aufruf-Text und Button, direkt unter dem Hero-Bereich."
            fields:
              - { label: "Überschrift Teil 1", name: "headline_teil1", widget: "string", hint: "z.B. Fit für die Straße. Stark im Ring." }
              - { label: "Überschrift Teil 2 (hervorgehoben, zweite Zeile)", name: "headline_teil2", widget: "string", hint: "z.B. Bereit für dich selbst." }
              - { label: "Untertext", name: "untertext", widget: "text" }
              - { label: "Button-Text", name: "button_text", widget: "string", hint: "z.B. Jetzt Probetraining buchen" }

          - label: "Startseite – Trainingsbereich"
            name: "training_bereich"
            widget: "object"
            hint: "Der Bereich 'Unser Training' mit den drei Kästchen Selbstverteidigung, Kampfsport und Fitness."
            fields:
              - { label: "Label über der Überschrift", name: "section_label", widget: "string", hint: "z.B. Was wir trainieren" }
              - { label: "Überschrift Teil 1", name: "titel_teil1", widget: "string", hint: "z.B. Unser" }
              - { label: "Überschrift Teil 2 (hervorgehoben)", name: "titel_teil2", widget: "string", hint: "z.B. Training" }
              - { label: "Beschreibungstext", name: "beschreibung", widget: "text" }
              - label: "Kästchen"
                name: "karten"
                widget: "list"
                label_singular: "Kästchen"
                summary: "{{titel}}"
                min: 1
                fields:
                  - { label: "Kategorie-Label (klein, über dem Titel)", name: "icon_label", widget: "string", hint: "z.B. Selbstverteidigung, Kampfsport, Fitness" }
                  - { label: "Titel", name: "titel", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }

